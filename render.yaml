# Render Blueprint — render.com에서 이 저장소를 연결하면 자동으로 인식해 Web Service를 만든다.
# 시크릿 값(OPENAI_API_KEY, WEBHOOK_TOKEN)은 sync:false라 이 파일에 값이 남지 않고,
# Render 대시보드에서 배포 시 직접 입력해야 한다.
services:
  - type: web
    name: aeo-geo-tool
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: WEBHOOK_TOKEN
        sync: false
      - key: AEO_FORCE_MOCK
        value: "false"
