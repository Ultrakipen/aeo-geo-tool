<!--
SOP §5 "FAQPage 스키마 마크업 (JSON-LD)" 원문.
snippetBuilder.js가 이 파일을 읽어 <script type="application/ld+json"> 안의
JSON 구조(= mainEntity[0]의 @type/필드 형태)를 그대로 재사용해
실제 FAQ 개수(N개)만큼 동적으로 생성한다. 즉 이 파일은 "정확한 스키마 형태"의
원본 자산이고, 실제 산출물은 snippetBuilder가 N개짜리로 복제해서 만든다.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "{질문1}",
      "acceptedAnswer": { "@type": "Answer", "text": "{답변1}" }
    },
    {
      "@type": "Question",
      "name": "{질문2}",
      "acceptedAnswer": { "@type": "Answer", "text": "{답변2}" }
    }
  ]
}
</script>
